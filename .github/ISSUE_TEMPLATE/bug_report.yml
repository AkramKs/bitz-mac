name: "🐛 Bug Report"
description: File a bug report to help us improve Bitz
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out this form as completely as possible.
        *Note: Every Pull Request must link to an approved issue ticket.*
  - type: input
    id: version
    attributes:
      label: Bitz Version / Commit
      description: What version of Bitz or commit hash are you using?
      placeholder: "e.g., 1.1.0 or commit abc1234"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS Version & Hardware
      description: What macOS version and architecture are you running?
      placeholder: "e.g., macOS Sonoma 14.5 (Apple Silicon M2 Pro)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Launch Bitz
        2. Perform action '...'
        3. Observe issue '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Add any relevant screenshots or console logs if applicable.
    validations:
      required: false
