name: Ticket Reference Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

jobs:
  check-ticket:
    name: Verify Linked Issue / Ticket
    runs-on: ubuntu-latest
    steps:
      - name: Validate Issue Link
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const title = pr.title || "";
            const content = `${title}\n${body}`;

            // Matches standard GitHub issue closing / reference keywords:
            // e.g. Fixes #123, Closes #45, Resolves #67, Issue: #89, refs #90
            const ticketPattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|issue|ref[s]?)\s*:?\s*#\d+/i;
            const fullUrlPattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/\d+/i;

            const hasTicket = ticketPattern.test(content) || fullUrlPattern.test(content);

            if (!hasTicket) {
              core.setFailed(
                "❌ Ticket verification failed: Every Pull Request targeting 'main' must reference a valid issue ticket (e.g., 'Closes #123' or 'Fixes #123'). Please create an issue ticket first and link it in the PR description."
              );
            } else {
              core.info("✅ Valid issue ticket reference detected in PR.");
            }
