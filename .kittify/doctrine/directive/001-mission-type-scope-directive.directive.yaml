enforcement: required
id: PROJECT_001
integrity_rules:
- The mascot window must remain a transparent overlay and must never replace or 
  alter the macOS desktop wallpaper.
- Mouse events must pass cleanly through the mascot overlay to windows 
  underneath (ignoresMouseEvents = true).
- Idle and 60 FPS animation overhead must stay below 2% CPU on Apple Silicon and
  below 70MB RAM.
intent: Deliver Bitz the Cyber Cat as a native macOS 14.0+ wellness and PC 
  health desktop companion rendered inside a borderless, transparent, 
  non-activating NSPanel overlay driven by RiveRuntime (BitzStateMachine) and 
  WellnessPointEngine without modifying user desktop wallpaper.
procedures:
- Verify MascotOverlayPanel configures .nonactivatingPanel, .borderless, clear 
  background, floating level, and ignoresMouseEvents = true.
- Drive BitzStateMachine inputs (speedMultiplier, visorColor, isStandby, 
  isGlitching, triggerPet) strictly from WellnessPointEngine state transitions.
- Evaluate productive ticks (+0.5 pts), distraction ticks (-1.5 pts), offline 
  breaks (+5.0 pts/min after >10m idle/lock), and CPU thermal alerts (>80C).
schema_version: '1.0'
scope: Applies to all specification, planning, implementation, and review 
  actions across MascotOverlayPanel, WellnessPointEngine, 
  ActivityMonitorService, and MascotOverlayView.
title: Bitz Desktop Companion Mission Scope Directive
validation_criteria:
- MascotOverlayPanel initializes with ignoresMouseEvents = true, isOpaque = 
  false, backgroundColor = .clear, and collectionBehavior [.canJoinAllSpaces, 
  .fullScreenAuxiliary, .stationary].
- WellnessPointEngine clamps points to 0.0...100.0 and maps 80...100 to 
  .superCharged, 40..<80 to .balanced, 15..<40 to .overworked, <15 to .burnout, 
  and isOverheating to .overheating.
- MascotOverlayView updates RiveViewModel inputs whenever 
  WellnessPointEngine.currentState changes.
