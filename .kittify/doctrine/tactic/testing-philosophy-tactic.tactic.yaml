applies_to_languages:
- swift
failure_modes:
- Testing Rive visual rendering manually without unit-testing state-to-input 
  mapping logic.
- Omitting boundary tests at exact threshold values (0.0, 15.0, 40.0, 80.0, 
  100.0) or overheating override states.
- Coupling WellnessPointEngine tests to live NSWorkspace or CGEventSource 
  hardware state instead of injectable abstractions.
id: testing-philosophy-tactic
name: Bitz Test-First Service and State Machine Verification
notes: Maintain >= 80% code coverage across src/Services/ and window/state 
  mapping layers.
purpose: Verify WellnessPointEngine, ActivityMonitorService, MascotOverlayPanel,
  and BitzStateMachine input bindings using test-driven development (TDD) with 
  Swift Testing and XCTest at 80%+ coverage.
schema_version: '1.0'
steps:
- description: Before implementing or modifying WellnessPointEngine or 
    ActivityMonitorService, author deterministic Swift Testing / XCTest cases 
    covering boundary transitions (15, 40, 80, 100 points, 0 floor, and 
    isOverheating override).
  examples:
  - 'Assert registerWorkTick(isProductiveApp: true) increments points by +0.5 up to
    100.0 and transitions to .superCharged at 80.0.'
  - 'Assert registerWorkTick(isProductiveApp: false) decrements points by -1.5 down
    to 0.0 and transitions through .overworked (15..<40) to .burnout (<15).'
  - 'Assert registerBreakTaken(minutes: 10) adds +50.0 points (5.0 pts/min) and restores
    .balanced or .superCharged state.'
  title: Write Failing State and Scoring Tests First (Red)
- description: Write the minimal Swift 6 implementation in src/Services/ and 
    src/App/ required to satisfy the failing test suite with zero compiler 
    warnings.
  examples:
  - Implement evaluateState(isOverheating:) with explicit overheating priority 
    before numeric point range matching.
  title: Implement Minimal Production Logic to Pass Tests (Green)
- description: Validate that each BitzState maps to the exact BitzStateMachine 
    inputs (speedMultiplier, visorColor, isStandby, isGlitching) and that 
    MascotOverlayPanel preserves borderless click-through properties.
  examples:
  - Verify .overheating sets isGlitching = true and visorColor = 3.0.
  - Verify MascotOverlayPanel sets ignoresMouseEvents = true, level = .floating,
    and isOpaque = false.
  title: Verify Rive Input Mapping and Overlay Window Invariants (Refactor)
